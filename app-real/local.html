<!doctype html>
<html lang="es-AR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#332e34"><meta name="description" content="Explorá Bioferia: charlas, experiencias, mapa y nuevas miradas. Una demo para recorrer la feria a tu manera."><title>Bioferia · Tu recorrido</title><link rel="icon" href="./assets/favicon.webp"><link rel="preload" href="./assets/BarlowSemiCondensed-Regular.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="./assets/Efrancd.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./fidelity.css"><link rel="stylesheet" href="./map.css"><link rel="stylesheet" href="./backgrounds.css"><link rel="stylesheet" href="./layout.css"></head><body><a href="#main-content" class="skip">Saltar al contenido</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"></dialog><noscript>Activá JavaScript para recorrer la webapp de Bioferia.</noscript><script>try{if(/[?&]reset/.test(location.search))localStorage.removeItem("bioferia-demo-v1");}catch(e){}</script>
<script src="./app.bundle.js"></script><script>/* control desde el juego (postMessage): {id,cmd:'reveal'|'rect'|'tap'|'type'|'go', sel, text, hash} */
addEventListener('message',function(e){var m=e.data||{};if(!m.cmd)return;var el=m.sel?document.querySelector(m.sel):null,out={id:m.id,cmd:m.cmd,ok:!!el};
try{if(m.cmd==='go'){location.hash=m.hash;out.ok=1;}
else if(m.cmd==='reveal'&&el){el.scrollIntoView({block:'center',behavior:'smooth'});}
else if(m.cmd==='rect'&&el){var r=el.getBoundingClientRect();out.rect={x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};}
else if(m.cmd==='tap'&&el){if(el.focus)el.focus({preventScroll:true});if(el.type==='submit'&&el.form&&el.form.requestSubmit)el.form.requestSubmit(el);else el.click();}
else if(m.cmd==='type'&&el){var i=0,t=m.text||'';el.focus({preventScroll:true});var iv=setInterval(function(){i++;el.value=t.slice(0,i);el.dispatchEvent(new Event('input',{bubbles:true}));if(i>=t.length)clearInterval(iv);},55);}}catch(x){out.err=String(x);}
if(e.source)e.source.postMessage(out,'*');});</script>
</body></html>
